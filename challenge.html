<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ABTalks - All Challenges</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="dashboard-header">

        <div>
            <p class="small-text">
                ABTALKS · 60 DAY CHALLENGE
            </p>

            <h2>
                All Challenges
            </h2>
        </div>

        <div class="profile-circle">
            D
        </div>

    </header>


    <main>

        <section class="challenge-info">

            <p class="small-text">
                YOUR JOURNEY
            </p>

            <h1>
                60 Days of Coding
            </h1>

            <p class="muted-text">
                Explore every challenge in the ABTalks coding journey.
            </p>

        </section>


        <section class="achievement-list" id="challenge-list">
            Loading challenges...
        </section>

    </main>


    <nav class="bottom-nav">

        <a href="index.html">
            <span>⌂</span>
            Home
        </a>

        <a href="dashboard.html">
            <span>▣</span>
            Dashboard
        </a>

        <a href="profile.html">
            <span>○</span>
            Profile
        </a>

    </nav>


    <script src="challenges.js"></script>

    <script>

    const challengeList =
        document.getElementById("challenge-list");

    const saved =
        localStorage.getItem("abtalks-dashboard-state");

    let currentDay = 12;

    if(saved)
    {
        try
        {
            const state = JSON.parse(saved);

            currentDay =
                Number(state.currentDay) || 12;
        }
        catch(error)
        {
            currentDay = 12;
        }
    }


    challenges.forEach(challenge =>
    {

        const card =
            document.createElement("div");

        card.className =
            "achievement";


        let status = "";

        if(challenge.day < currentDay)
        {
            status = "✓ COMPLETED";
        }
        else if(challenge.day === currentDay)
        {
            status = "● CURRENT";
        }
        else
        {
            status = "LOCKED";
        }


        card.innerHTML = `
            <div class="achievement-icon">
                ${String(challenge.day).padStart(2, "0")}
            </div>

            <div>
                <h4>
                    ${challenge.title}
                </h4>

                <p>
                    ${challenge.level} · ${challenge.time}
                </p>

                <p>
                    ${status}
                </p>

                <a href="challenge.html?day=${challenge.day}">
                    View Challenge →
                </a>
            </div>
        `;


        challengeList.appendChild(card);

    });

</script>

</body>

</html>
