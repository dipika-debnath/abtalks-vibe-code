<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ABTalks - Challenge</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="dashboard-header">

        <div>
            <p class="small-text">
                ABTALKS · 60 DAY CHALLENGE
            </p>

            <h2>
                Today's Challenge
            </h2>
        </div>

        <div class="profile-circle">
            D
        </div>

    </header>


    <main>

        <section class="challenge-info">

            <p class="small-text" id="challenge-day">
                DAY 12 · BEGINNER
            </p>

            <h1 id="challenge-title">
                Loading challenge...
            </h1>

            <p class="muted-text" id="challenge-description">
                Loading challenge description...
            </p>

        </section>


        <section class="mission-card">

            <div class="mission-details">

                <span id="challenge-time">
                    ⏱ Loading
                </span>

                <span id="challenge-tool">
                    💻 Loading
                </span>

            </div>


            <h3>
                Your Tasks
            </h3>


            <div id="challenge-tasks">
                Loading tasks...
            </div>


            <button id="complete-button"
                    class="primary-button"
                    type="button">

                Mark Challenge Complete

            </button>


            <p id="completion-message"
               class="muted-text"
               style="display:none; margin-top:14px;">

            </p>

        </section>


        <section class="mission-card">

            <a href="dashboard.html"
               class="secondary-button">

                ← Back to Dashboard

            </a>

        </section>

    </main>


    <nav class="bottom-nav">

        <a href="index.html">

            <span>⌂</span>
            Home

        </a>


        <a href="dashboard.html"
           class="active">

            <span>▣</span>
            Challenge

        </a>


        <a href="profile.html">

            <span>○</span>
            Profile

        </a>

    </nav>


    <script src="challenges.js"></script>


    <script>

        const params =
            new URLSearchParams(window.location.search);


        const requestedDay =
            Number(params.get("day"));


        const saved =
            localStorage.getItem("abtalks-dashboard-state");


        let currentDay = 12;


        if(saved)
        {
            try
            {
                const state =
                    JSON.parse(saved);

                currentDay =
                    Number(state.currentDay) || 12;

            }
            catch(error)
            {
                currentDay = 12;
            }
        }


        const day =
            requestedDay || currentDay;


        const challenge =
            challenges.find(
                item => item.day === day
            );


        const title =
            document.getElementById("challenge-title");


        const description =
            document.getElementById("challenge-description");


        const dayLabel =
            document.getElementById("challenge-day");


        const time =
            document.getElementById("challenge-time");


        const tool =
            document.getElementById("challenge-tool");


        const taskContainer =
            document.getElementById("challenge-tasks");


        const completeButton =
            document.getElementById("complete-button");


        const completionMessage =
            document.getElementById("completion-message");


        if(!challenge)
        {

            title.textContent =
                "Challenge Not Found";

            description.textContent =
                "The requested challenge does not exist.";

            dayLabel.textContent =
                "ERROR";

            completeButton.style.display =
                "none";

        }
        else
        {

            document.title =
                `ABTalks - Day ${challenge.day}`;


            dayLabel.textContent =
                `DAY ${challenge.day} · ${challenge.level}`;


            title.textContent =
                challenge.title;


            description.textContent =
                challenge.description;


            time.textContent =
                `⏱ ${challenge.time}`;


            tool.textContent =
                `💻 ${challenge.tool}`;


            taskContainer.innerHTML = "";


            challenge.tasks.forEach(
                (task, index) =>
                {

                    const taskItem =
                        document.createElement("p");


                    taskItem.textContent =
                        `${index + 1}. ${task}`;


                    taskContainer.appendChild(
                        taskItem
                    );

                }
            );


            if(day !== currentDay)
            {

                completeButton.style.display =
                    "none";

            }


            completeButton.addEventListener(
                "click",
                function()
                {

                    const savedState =
                        localStorage.getItem(
                            "abtalks-dashboard-state"
                        );


                    let state =
                    {
                        currentDay: 12,
                        streakDays: 11
                    };


                    if(savedState)
                    {

                        try
                        {
                            state =
                                JSON.parse(savedState);
                        }
                        catch(error)
                        {
                            state =
                            {
                                currentDay: 12,
                                streakDays: 11
                            };
                        }

                    }


                    if(state.currentDay === day)
                    {

                        state.currentDay += 1;
                        state.streakDays += 1;


                        localStorage.setItem(
                            "abtalks-dashboard-state",
                            JSON.stringify(state)
                        );


                        completeButton.textContent =
                            "Challenge Completed";


                        completeButton.disabled =
                            true;


                        completionMessage.textContent =
                            `Great job! Day ${day} is complete.`;

                        completionMessage.style.display =
                            "block";

                    }

                }
            );

        }

    </script>

</body>

</html>
